# Single ECS baseline; sites belong in conf.d, without a default public listener.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # Do not record query strings or authorization headers in the access log.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/nginx/conf.d/*.conf;
}
