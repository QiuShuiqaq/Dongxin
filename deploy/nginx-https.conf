# Legacy operations-only example. Prefer nginx-public.conf.template for the
# separate operations and device hosts. Never install this with a placeholder.
limit_req_zone $binary_remote_addr zone=dongxin_login:1m rate=5r/m;

server {
    listen 80;
    server_name ops.zjdongxin.net;
    return 301 https://ops.zjdongxin.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops.zjdongxin.net;
    ssl_certificate /etc/pki/dongxin/ops/fullchain.pem;
    ssl_certificate_key /etc/pki/dongxin/ops/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow __DONGXIN_OFFICE_CIDR__;
    deny all;
    root /opt/dongxin/current/apps/operations-console/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=dongxin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/dongxin-proxy.conf;
    }
    # Development-only routes are not part of the public operations deployment.
    location /api/development/ { return 404; }
    # Initial operations-only deployment. Device access gets its own TLS entry later.
    location /api/device/ { return 403; }
    location /api/ {
        include /etc/nginx/dongxin-proxy.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
