# Initial readiness only: no public HTTP login or device access.
# Install as /etc/nginx/conf.d/dongxin.conf after checking existing server blocks.
limit_req_zone $binary_remote_addr zone=dongxin_login:1m rate=5r/m;

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/dongxin/current/apps/operations-console/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = /api/auth/login {
        limit_req zone=dongxin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/dongxin-proxy.conf;
    }
    location /api/development/ { return 404; }
    location /api/device/ { return 403; }
    location /api/ {
        include /etc/nginx/dongxin-proxy.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
